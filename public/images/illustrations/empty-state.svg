<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" width="500" height="400">
  <defs>
    <linearGradient id="emptyGrad" x1="0" y1="0" x2="500" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4DD9FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <circle cx="250" cy="200" r="140" fill="#141530" stroke="url(#emptyGrad)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <!-- Floating Box / Glass Folder -->
  <g transform="translate(250, 180)">
    <rect x="-70" y="-50" width="140" height="100" rx="20" fill="#141530" stroke="url(#emptyGrad)" stroke-width="2"/>
    <path d="M-70 -20 H70" stroke="url(#emptyGrad)" stroke-width="1.5" opacity="0.4"/>
    <!-- Magnifier with Question/Sparkle -->
    <circle cx="15" cy="15" r="28" stroke="#4DD9FF" stroke-width="4" fill="#0A0B1E"/>
    <path d="M35 35 L58 58" stroke="#4DD9FF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="15" cy="15" r="6" fill="#8B5CF6"/>
  </g>
  <text x="250" y="320" font-family="'Inter',sans-serif" font-size="16" font-weight="500" fill="#A0A2C0" text-anchor="middle">No items found</text>
</svg>