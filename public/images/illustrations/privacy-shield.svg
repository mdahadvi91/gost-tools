<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none" width="600" height="500">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4DD9FF"/>
      <stop offset="50%" stop-color="#5B9BFF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4DD9FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A0B1E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="300" cy="240" r="180" fill="url(#shieldGlow)"/>

  <!-- Shield Base -->
  <path d="M300 80 L440 130 V260 C440 350 380 410 300 440 C220 410 160 350 160 260 V130 Z" fill="#141530" stroke="url(#shieldGrad)" stroke-width="4"/>
  <path d="M300 110 L410 150 V255 C410 330 360 380 300 405 C240 380 190 330 190 255 V150 Z" fill="#0A0B1E" opacity="0.6"/>

  <!-- Lock Icon in Shield Center -->
  <g transform="translate(300, 250)">
    <rect x="-40" y="-10" width="80" height="65" rx="14" fill="url(#shieldGrad)"/>
    <path d="M-22 -10 V-30 C-22 -44 -12 -54 0 -54 C12 -54 22 -44 22 -30 V-10" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="18" r="7" fill="#0A0B1E"/>
    <path d="M0 24 V34" stroke="#0A0B1E" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Orbiting Verification Badges -->
  <g transform="translate(180, 160)">
    <rect width="100" height="34" rx="17" fill="#141530" stroke="#3DFFC0" stroke-width="1.5"/>
    <circle cx="16" cy="17" r="4" fill="#3DFFC0"/>
    <text x="28" y="22" font-family="'JetBrains Mono',monospace" font-size="11" fill="#3DFFC0" font-weight="600">CLIENT-ONLY</text>
  </g>
  <g transform="translate(330, 360)">
    <rect width="110" height="34" rx="17" fill="#141530" stroke="#4DD9FF" stroke-width="1.5"/>
    <circle cx="16" cy="17" r="4" fill="#4DD9FF"/>
    <text x="28" y="22" font-family="'JetBrains Mono',monospace" font-size="11" fill="#4DD9FF" font-weight="600">ZERO STORAGE</text>
  </g>
</svg>