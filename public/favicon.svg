<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="512" height="512">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4DD9FF"/>
      <stop offset="35%" stop-color="#5B9BFF"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5B9BFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0A0B1E" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base squircle -->
  <rect width="512" height="512" rx="128" fill="#0A0B1E"/>
  <rect x="6" y="6" width="500" height="500" rx="124" stroke="url(#logoGrad)" stroke-width="4" stroke-opacity="0.4" fill="none"/>
  <circle cx="256" cy="256" r="220" fill="url(#iconGlow)"/>

  <!-- Stylized A Symbol with Lightning Core -->
  <g transform="translate(256, 256) scale(2.2)" filter="url(#dropShadow)">
    <!-- Left Leg -->
    <path d="M-45 55 L-15 -60 L6 -60 L18 -15 L-8 -15 L-25 45 Z" fill="url(#logoGrad)"/>
    <!-- Right Leg -->
    <path d="M45 55 L15 -60 L-6 -60 L-18 -15 L8 -15 L25 45 Z" fill="url(#logoGrad)" opacity="0.88"/>
    <!-- Dynamic Lightning Crossbar -->
    <polygon points="-28,6 28,6 10,32 -10,32" fill="#FFFFFF"/>
    <polygon points="-12,6 18,6 4,24 -8,24" fill="#4DD9FF"/>
  </g>
</svg>